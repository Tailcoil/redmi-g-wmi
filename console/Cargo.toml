[package]
name = "redmi-g-console"
version = "0.1.0"
edition = "2024"
description = "Redmi G 2022 本机控制台"
license = "GPL-2.0-or-later"

[dependencies]
axum = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[profile.release]
strip = true
lto = true
panic = "abort"
